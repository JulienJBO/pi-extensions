name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package to publish"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - pi-antigravity
          - pi-auto-session-title
          - pi-theme
  push:
    tags:
      - "v*"
      - "*@*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run Tests
        run: npm test

      - name: Publish Packages
        run: |
          publish_pkg() {
            local dir="$1"
            if [ ! -f "$dir/package.json" ]; then
              return 0
            fi

            local name=$(node -p "require('./$dir/package.json').name")
            local version=$(node -p "require('./$dir/package.json').version")

            echo "----------------------------------------"
            echo "Checking $name@$version in $dir..."

            # Check if this exact version is already published
            local published_version=$(npm view "$name@$version" version 2>/dev/null || true)
            if [ "$published_version" = "$version" ]; then
              echo "⏭️  $name@$version is already published on npm. Skipping."
              return 0
            fi

            echo "🚀 Publishing $name@$version to npm..."
            npm publish --workspace="$dir" --access public
            echo "✅ Successfully published $name@$version"
          }

          TARGET="${{ inputs.package }}"
          if [ -z "$TARGET" ] || [ "$TARGET" = "all" ]; then
            for pkg in packages/*; do
              if [ -d "$pkg" ]; then
                publish_pkg "$pkg"
              fi
            done
          else
            publish_pkg "packages/$TARGET"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
